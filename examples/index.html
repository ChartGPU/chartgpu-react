<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChartGPU React - Examples</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #0a0a0a;
        color: #e0e0e0;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 2rem;
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .subtitle {
        color: #a0a0a0;
        margin-bottom: 3rem;
        font-size: 1.1rem;
      }

      .example-section {
        margin-bottom: 3rem;
      }

      .example-title {
        font-size: 1.5rem;
        font-weight: 600;
        margin-bottom: 1rem;
        color: #f0f0f0;
      }

      .chart-container {
        background: #1a1a1a;
        border: 1px solid #2a2a2a;
        border-radius: 8px;
        padding: 1.5rem;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }

      .error-message {
        background: #2a1515;
        border: 1px solid #5a2020;
        border-radius: 8px;
        padding: 1rem;
        color: #ff6b6b;
        margin-bottom: 1rem;
      }

      .info-box {
        background: #1a2a3a;
        border: 1px solid #2a4a6a;
        border-radius: 8px;
        padding: 1rem;
        margin-bottom: 1.5rem;
        color: #9ab4d0;
      }

      .info-box strong {
        color: #b0d0ff;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>ChartGPU React</h1>
      <p class="subtitle">WebGPU-powered charting for React applications</p>
      
      <div id="root"></div>
    </div>

    <script type="module" src="/examples/main.tsx"></script>
  </body>
</html>
